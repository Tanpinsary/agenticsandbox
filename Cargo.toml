[package]
name = "agenticsandbox"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Task-scoped remote execution and verified Git delivery over Coder"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
httparse = "1.10.1"
libc = "0.2"
rand = "0.9"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
unicode-casefold = "0.2.0"

[build-dependencies]
serde_json = "1.0.151"
sha2 = "0.10.9"

[profile.release]
lto = "thin"
strip = true
